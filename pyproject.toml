[project]
name = "neural-network-from-scratch"
version = "0.1.0"
description = "A small deep-learning library written in NumPy: dense layers, activations, losses, backpropagation, SGD/momentum/Adam and gradient checking, trained to 97%+ accuracy on MNIST."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rafferty Carter-Lazenbury" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_net"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=neural_net --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["neural_net"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY"]
